[global]
# Adds a 15,000 microsecond (15ms) delay between macro keystrokes 
# to prevent Wayland from dropping characters!
macro_sequence_timeout = 15000

[ids]
*

[main]
meta = overload(meta, A-space)
capslock = overload(control, esc)
rightalt = layer(nav)
leftshift = overload(shift, S-9)
rightshift = overload(shift, S-0)

[shift]
f1 = f13
f2 = f14
f3 = f15
f4 = f16
f5 = f17
f6 = f18
f7 = f19
f8 = f20
f9 = f21
f10 = f22
f11 = f23
f12 = f24

[nav]
# --- NUMPAD ---
u = 7
i = 8
o = 9
j = 4
k = 5
l = 6
m = 1
, = 2
. = 3
space = 0
; = enter
p = backspace
/ = -

# --- ARROWS ---
w = up
a = left
s = down
d = right
q = home
e = end
r = pageup
f = pagedown

# --- MEDIA CONTROLS ---
- = volumedown
= = volumeup
0 = mute
[ = previoussong
] = nextsong
\ = playpause

# --- TEXT MACROS (Customizable) ---
1 = macro(johnvarghese.work@gmail.com space)
2 = macro(github.com/John-Varghese-EH/)
3 = macro(linkedin.com/in/John--Varghese/)
# Macro for specific Unicode insertion via key combination (e.g. C-S-u)
z = macro(C-S-u 3 1 6 4 space)

[nav+shift]
# --- MOUSE CONTROL (Hold RightAlt + LeftShift) ---
# Requires ydotool service and niri config mapping!
w = C-A-S-up
s = C-A-S-down
a = C-A-S-left
d = C-A-S-right
j = C-A-S-,
k = C-A-S-.
