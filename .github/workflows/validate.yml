name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-scripts:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './'
          format: gcc
          severity: style

  lint-markdown:
    name: Lint Markdown Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
        continue-on-error: true

  validate-configs:
    name: Validate System Configurations
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Build Environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git make gcc base-devel

      - name: Validate Niri Compositor Config
        run: |
          pacman -S --noconfirm niri
          echo "::group::Niri Validation Output"
          mkdir -p /tmp/niri-val
          cp -r niri/* /tmp/niri-val/
          niri validate -c /tmp/niri-val/config.kdl
          echo "::endgroup::"

      - name: Validate Keyd Remapping Config
        run: |
          echo "::group::Building Keyd from Source"
          pacman -S --noconfirm keyd || (git clone https://github.com/rvaiya/keyd /tmp/keyd && cd /tmp/keyd && make && make install)
          echo "::endgroup::"
          echo "::group::Keyd Validation Output"
          keyd check keyd/default.conf
          echo "::endgroup::"
